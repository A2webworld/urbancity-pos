<!-- payment-callback.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment - UrbanCity</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(30,30,35,0.95);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,152,0,0.3);
            max-width: 400px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #ff9800;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #ff9800;
            color: #fff;
            border: none;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container" id="statusContainer">
        <div class="spinner"></div>
        <h2>Processing Your Payment...</h2>
        <p>Please wait while we confirm your order.</p>
        <div id="statusMessage"></div>
    </div>

    <script>
        (async function() {
            try {
                // Get transaction reference from URL
                const params = new URLSearchParams(window.location.search);
                const paymentRef = params.get('paymentReference') || params.get('trxref');
                
                if (!paymentRef) {
                    throw new Error('No payment reference found');
                }

                // Check payment status (you can add a function to verify with Monnify)
                // For now, redirect to success after a delay
                setTimeout(() => {
                    // Clear cart and show success
                    localStorage.removeItem('urbancity_cart');
                    window.location.href = 'index.html?payment=success';
                }, 3000);

            } catch (error) {
                document.getElementById('statusContainer').innerHTML = `
                    <h2 class="error">❌ Payment Error</h2>
                    <p>${error.message}</p>
                    <a href="checkout.html" class="btn">Try Again</a>
                `;
            }
        })();
    </script>
</body>
</html>
