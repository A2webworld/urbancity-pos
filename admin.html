<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanCity - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255,152,0,0.3);
        }
        h1 {
            color: #ff9800;
            font-size: 1.8rem;
        }
        h1 i, h2 i {
            margin-right: 10px;
        }
        .logout-btn, .add-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .add-btn {
            background: #4caf50;
        }
        .logout-btn:hover, .add-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(30,30,35,0.95);
            padding: 20px 30px;
            border-radius: 15px;
            flex: 1;
            min-width: 150px;
            text-align: center;
            border: 1px solid rgba(255,152,0,0.3);
            cursor: pointer;
            transition: all 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            background: rgba(255,152,0,0.1);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff9800;
        }
        .stat-label {
            color: #aaa;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            color: #aaa;
            font-weight: bold;
            transition: all 0.2s;
            border-radius: 8px;
        }
        .tab-btn.active {
            background: #ff9800;
            color: #111;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .search-box {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,152,0,0.3);
            border-radius: 30px;
            color: white;
            width: 280px;
            outline: none;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #ff9800;
            color: #111;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .item-card {
            background: rgba(30,30,35,0.95);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,152,0,0.3);
            transition: transform 0.2s;
        }
        .item-card:hover {
            transform: translateY(-3px);
        }
        .item-image {
            height: 150px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .availability-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-available {
            background: #4caf50;
            color: white;
        }
        .badge-unavailable {
            background: #e74c3c;
            color: white;
        }
        .item-content {
            padding: 15px;
        }
        .item-name {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .item-category {
            color: #ff9800;
            font-size: 0.7rem;
            margin-bottom: 8px;
        }
        .item-price {
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .action-buttons button {
            flex: 1;
            min-width: 100px;
            padding: 10px 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        .toggle-available, .toggle-unavailable, .edit-btn, .delete-btn, .add-btn, .logout-btn, .filter-btn, .tab-btn, .stat-card, .theme-toggle, .close-modal, .add-variant, .save-btn {
            cursor: pointer;
        }
        .toggle-available {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .toggle-available:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
            background: linear-gradient(135deg, #45a049, #3d8b40);
        }
        .toggle-unavailable {
            background: linear-gradient(135deg, #ff9800, #e68900);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .toggle-unavailable:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
            background: linear-gradient(135deg, #e68900, #cc7a00);
        }
        .edit-btn {
            background: linear-gradient(135deg, #2196f3, #0d8aee);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
            background: linear-gradient(135deg, #0d8aee, #0b7bda);
        }
        .delete-btn {
            background: linear-gradient(135deg, #f44336, #e53935);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
            background: linear-gradient(135deg, #e53935, #d32f2f);
        }
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1e1e23;
            --bg-card: rgba(30,30,35,0.95);
            --text-primary: #fff;
            --text-secondary: #aaa;
            --border-color: rgba(255,152,0,0.3);
            --input-bg: #333;
            --input-border: #555;
        }
        :root.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #111;
            --text-secondary: #666;
            --border-color: rgba(0,0,0,0.1);
            --input-bg: #f0f0f0;
            --input-border: #ddd;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .stat-card, .item-card, .modal-content {
            background: var(--bg-card);
            border-color: var(--border-color);
        }
        .search-box, .form-group input, .form-group textarea, .form-group select {
            background: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
        }
        .variant-item {
            background: var(--bg-secondary);
        }
        .stat-label, .item-category, .item-price {
            color: var(--text-secondary);
        }
        .filters .filter-btn, .tab-btn {
            color: var(--text-primary);
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            transition: all 0.3s;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            transform: scale(1.02);
        }
        .theme-toggle i {
            font-size: 1.1rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e23;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #ff9800;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            color: #ff9800;
        }
        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ddd;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 8px;
            color: white;
        }
        .variant-item {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .add-variant {
            background: #2196f3;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        .save-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #4caf50;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #ff9800;
        }

        /* NEW: Image upload preview styles */
        .image-upload-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .image-upload-wrapper .image-preview {
            width: 100%;
            max-height: 200px;
            border-radius: 8px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed #555;
            position: relative;
        }
        .image-upload-wrapper .image-preview img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        .image-upload-wrapper .image-preview .placeholder-text {
            color: #888;
            font-size: 0.9rem;
            padding: 20px;
            text-align: center;
        }
        .image-upload-wrapper .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .image-upload-wrapper .file-input-wrapper input[type="file"] {
            flex: 1;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
        }
        .image-upload-wrapper .file-input-wrapper input[type="file"]::file-selector-button {
            background: #ff9800;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            color: #111;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }
        .image-upload-wrapper .upload-status {
            font-size: 0.8rem;
            color: #ff9800;
            margin-top: 5px;
        }
        .image-url-display {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 5px;
        }
        .image-url-display input {
            flex: 1;
            padding: 6px 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: #aaa;
            font-size: 0.75rem;
        }
        .image-url-display button {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: column;
                gap: 8px;
            }
            .action-buttons button {
                width: 100%;
                white-space: normal;
                padding: 10px;
            }
            .toggle-available, .toggle-unavailable, .edit-btn, .delete-btn {
                justify-content: center;
            }
            .items-grid {
                grid-template-columns: 1fr;
            }
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1><i class="fas fa-crown"></i> UrbanCity Admin Dashboard</h1>
            <div style="color: #aaa; font-size: 0.85rem;">Manage menu items, availability, prices, and more</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="add-btn" onclick="openAddModal()"><i class="fas fa-plus"></i> Add New Item</button>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
                <i class="fas fa-moon"></i>
                <span>Dark Mode</span>
            </button>
        </div>
    </div>
    
    <!-- Stats Overview -->
    <div class="stats">
        <div class="stat-card" onclick="filterByStatus('all')">
            <div class="stat-number" id="totalItems">0</div>
            <div class="stat-label">Total Items</div>
        </div>
        <div class="stat-card" onclick="filterByStatus('available')">
            <div class="stat-number" id="availableItems">0</div>
            <div class="stat-label">✅ Available</div>
        </div>
        <div class="stat-card" onclick="filterByStatus('unavailable')">
            <div class="stat-number" id="unavailableItems">0</div>
            <div class="stat-label">❌ Unavailable</div>
        </div>
        <div class="stat-card" onclick="openCategoryModal()">
            <div class="stat-number" id="categoryCount">0</div>
            <div class="stat-label">📁 Categories</div>
        </div>
    </div>
    
    <!-- Search and Filters -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
        <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search menu items...">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="available">✅ Available</button>
            <button class="filter-btn" data-filter="unavailable">❌ Unavailable</button>
        </div>
    </div>
    
    <!-- Items Grid -->
    <div id="itemsGrid" class="items-grid">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading menu items...</div>
    </div>
    
    <!-- Edit/Add Item Modal -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Edit Menu Item</h2>
                <button class="close-modal" onclick="closeItemModal()">&times;</button>
            </div>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <div class="form-group">
                    <label>Item Name *</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="categoryId" required></select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Type (e.g., Signature, Spicy, Combo)</label>
                    <input type="text" id="type">
                </div>
                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="tags" placeholder="e.g., Spicy, Popular, Premium">
                </div>
                
                <!-- ============================================ -->
                <!-- IMAGE UPLOAD - NEW SECTION -->
                <!-- ============================================ -->
                <div class="form-group">
                    <label>Item Image</label>
                    <div class="image-upload-wrapper">
                        <div class="image-preview" id="imagePreview">
                            <span class="placeholder-text">No image selected</span>
                        </div>
                        <div class="file-input-wrapper">
                            <input type="file" id="imageFile" accept="image/*" onchange="handleImageFileSelect(event)">
                            <button type="button" class="add-variant" onclick="uploadImageToSupabase()" style="margin: 0; white-space: nowrap;">
                                <i class="fas fa-cloud-upload-alt"></i> Upload
                            </button>
                        </div>
                        <div class="image-url-display">
                            <input type="text" id="image" placeholder="Image URL will appear here" readonly>
                            <button type="button" onclick="clearImage()" title="Clear image">✕</button>
                        </div>
                        <div class="upload-status" id="uploadStatus"></div>
                    </div>
                </div>
                <!-- ============================================ -->
                
                <div class="form-group">
                    <label>Simple Price Display (for items without variants)</label>
                    <input type="text" id="priceDisplay" placeholder="₦7,500 or #7,500">
                </div>
                <div class="form-group">
                    <label>Icon (Font Awesome class)</label>
                    <input type="text" id="icon" placeholder="fas fa-pepper-hot">
                </div>
                
                <h3><i class="fas fa-layer-group"></i> Variants (Sizes/Options)</h3>
                <div id="variantsContainer"></div>
                <button type="button" class="add-variant" onclick="addVariant()">+ Add Variant</button>
                
                <button type="button" class="save-btn" onclick="saveMenuItem()">💾 Save Changes</button>
            </form>
        </div>
    </div>
    
    <!-- Category Manager Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-folder"></i> Manage Categories</h2>
                <button class="close-modal" onclick="closeCategoryModal()">&times;</button>
            </div>
            <button class="add-btn" onclick="openAddCategoryForm()" style="margin-bottom: 20px; width: 100%;">+ Add New Category</button>
            <div id="categoriesList"></div>
        </div>
    </div>
    
    <!-- Add/Edit Category Form Modal -->
    <div id="categoryFormModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="categoryFormTitle">Add Category</h2>
                <button class="close-modal" onclick="closeCategoryFormModal()">&times;</button>
            </div>
            <form>
                <input type="hidden" id="editCategoryId">
                <div class="form-group">
                    <label>Category ID (unique, no spaces)</label>
                    <input type="text" id="categoryIdValue" placeholder="e.g., new-category" required>
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="categoryName" placeholder="e.g., New Category Name" required>
                </div>
                <div class="form-group">
                    <label>Display Order</label>
                    <input type="number" id="categoryDisplayOrder" value="0">
                </div>
                <div class="form-group">
                    <label>Active?</label>
                    <select id="categoryActive">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <button type="button" class="save-btn" onclick="saveCategory()">💾 Save Category</button>
            </form>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://bpeyueppcksrbhugltjt.supabase.co';
            const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwZXl1ZXBwY2tzcmJodWdsdGp0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NDY1NDg3MiwiZXhwIjoyMDgwMjMwODcyfQ.n2n7L6E0xoW8-myGcX869mUfEfYRS3C0llXFvi581tg';
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);
            
            let allItems = [];
            let allCategories = [];
            let allVariants = [];
            let searchTerm = '';
            let currentFilter = 'all';
            
            // ============================================
            // IMAGE UPLOAD STATE
            // ============================================
            let selectedFile = null;
            let currentImageUrl = '';
            let isUploading = false;
            
            // ============================================
            // AUTH
            // ============================================
            function checkAuth() {
                if (!sessionStorage.getItem('admin_logged_in')) {
                    const pwd = prompt('🔐 Enter admin password:');
                    if (pwd === 'UrbanCity2025') {

                window.location.reload();
            }
            
            // ============================================
            // LOAD DATA
            // ============================================
            async function loadAllData() {
                await Promise.all([loadCategories(), loadItems(), loadVariants()]);
                updateStats();
                renderItems();
                populateCategorySelect();
            }
            
            async function loadCategories() {
                const { data, error } = await supabase.from('categories').select('*').order('display_order');
                if (!error) allCategories = data;
                return allCategories;
            }
            
            async function loadItems() {
                const { data, error } = await supabase.from('menu_items').select('*').order('name');
                if (!error) allItems = data;
                return allItems;
            }
            
            async function loadVariants() {
                const { data, error } = await supabase.from('variants').select('*');
                if (!error) allVariants = data;
                return allVariants;
            }
            
            function updateStats() {
                const total = allItems.length;
                const available = allItems.filter(i => i.is_available === true).length;
                const unavailable = total - available;
                document.getElementById('totalItems').textContent = total;
                document.getElementById('availableItems').textContent = available;
                document.getElementById('unavailableItems').textContent = unavailable;
                document.getElementById('categoryCount').textContent = allCategories.length;
            }
            
            function populateCategorySelect() {
                const select = document.getElementById('categoryId');
                if (select) {
                    select.innerHTML = allCategories.map(cat => 
                        `<option value="${cat.category_id}">${cat.name}</option>`
                    ).join('');
                }
            }
            
            function filterByStatus(status) {
                currentFilter = status;
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === status) btn.classList.add('active');
                });
                renderItems();
            }
            
            function renderItems() {
                let filtered = [...allItems];
                
                if (currentFilter === 'available') {
                    filtered = filtered.filter(i => i.is_available === true);
                } else if (currentFilter === 'unavailable') {
                    filtered = filtered.filter(i => i.is_available === false);
                }
                
                if (searchTerm) {
                    filtered = filtered.filter(i => 
                        i.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (i.category_id && i.category_id.toLowerCase().includes(searchTerm.toLowerCase()))
                    );
                }
                
                const container = document.getElementById('itemsGrid');
                if (filtered.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:50px; color:#aaa;">No items found</div>';
                    return;
                }
                
                container.innerHTML = filtered.map(item => {
                    const category = allCategories.find(c => c.category_id === item.category_id);
                    const itemVariants = allVariants.filter(v => v.menu_item_id === item.item_id);
                    const priceDisplay = itemVariants.length > 0 
                        ? itemVariants.map(v => v.display).join(', ')
                        : (item.price_display || `₦${item.price?.toLocaleString() || 'Price varies'}`);
                    
                    // Check if image URL is from Supabase Storage
                    const imageUrl = item.image || '';
                    
                    return `
                        <div class="item-card">
                            <div class="item-image" style="background-image: url('${imageUrl}'); background-size: cover; background-position: center;">
                                <div class="availability-badge ${item.is_available ? 'badge-available' : 'badge-unavailable'}">
                                    <i class="fas ${item.is_available ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                                    ${item.is_available ? 'Available' : 'Unavailable'}
                                </div>
                            </div>
                            <div class="item-content">
                                <div class="item-name">${escapeHtml(item.name)}</div>
                                <div class="item-category"><i class="fas fa-tag"></i> ${category?.name || item.category_id}</div>
                                <div class="item-price"><i class="fas fa-naira-sign"></i> ${escapeHtml(priceDisplay)}</div>
                                <div class="action-buttons">
                                    <button class="${item.is_available ? 'toggle-unavailable' : 'toggle-available'}" onclick="toggleAvailability('${item.item_id}', ${item.is_available})">
                                        <i class="fas ${item.is_available ? 'fa-ban' : 'fa-check-circle'}"></i>
                                        ${item.is_available ? 'Mark Unavailable' : 'Mark Available'}
                                    </button>
                                    <button class="edit-btn" onclick="openEditModal('${item.item_id}')"><i class="fas fa-edit"></i> Edit</button>
                                    <button class="delete-btn" onclick="deleteItem('${item.item_id}')"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            
            // ============================================
            // IMAGE UPLOAD FUNCTIONS
            // ============================================
            function handleImageFileSelect(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                // Validate file type
                const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/jpg'];
                if (!validTypes.includes(file.type)) {
                    showToast('❌ Please select a valid image file (JPEG, PNG, GIF, WEBP)');
                    event.target.value = '';
                    return;
                }
                
                // Validate file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    showToast('❌ Image must be less than 5MB');
                    event.target.value = '';
                    return;
                }
                
                selectedFile = file;
                currentImageUrl = '';
                
                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    document.getElementById('uploadStatus').textContent = '📷 File selected. Click "Upload" to save.';
                    document.getElementById('uploadStatus').style.color = '#ff9800';
                };
                reader.readAsDataURL(file);
            }
            
            async function uploadImageToSupabase() {
                if (!selectedFile) {
                    showToast('⚠️ Please select an image file first');
                    return;
                }
                
                if (isUploading) {
                    showToast('⏳ Upload already in progress...');
                    return;
                }
                
                isUploading = true;
                const statusEl = document.getElementById('uploadStatus');
                statusEl.textContent = '📤 Uploading...';
                statusEl.style.color = '#2196f3';
                
                try {
                    // Generate a unique filename
                    const timestamp = Date.now();
                    const fileExt = selectedFile.name.split('.').pop();
                    const fileName = `menu-${timestamp}.${fileExt}`;
                    const filePath = `menu-items/${fileName}`;
                    
                    // Upload to Supabase Storage
                    const { data, error } = await supabase.storage
                        .from('menu-images')
                        .upload(filePath, selectedFile, {
                            cacheControl: '3600',
                            upsert: false
                        });
                    
                    if (error) {
                        throw error;
                    }
                    
                    // Get public URL
                    const { data: urlData } = supabase.storage
                        .from('menu-images')
                        .getPublicUrl(filePath);
                    
                    const publicUrl = urlData.publicUrl;
                    currentImageUrl = publicUrl;
                    
                    // Update the image field
                    document.getElementById('image').value = publicUrl;
                    
                    // Update preview
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${publicUrl}" alt="Uploaded image">`;
                    
                    statusEl.textContent = '✅ Image uploaded successfully!';
                    statusEl.style.color = '#4caf50';
                    
                    showToast('✅ Image uploaded to Supabase Storage!');
                    
                } catch (error) {
                    console.error('Upload error:', error);
                    statusEl.textContent = '❌ Upload failed: ' + error.message;
                    statusEl.style.color = '#e74c3c';
                    showToast('❌ Upload failed: ' + error.message);
                } finally {
                    isUploading = false;
                }
            }
            
            function clearImage() {
                selectedFile = null;
                currentImageUrl = '';
                document.getElementById('image').value = '';
                document.getElementById('imageFile').value = '';
                document.getElementById('imagePreview').innerHTML = '<span class="placeholder-text">No image selected</span>';
                document.getElementById('uploadStatus').textContent = '';
                showToast('🗑️ Image cleared');
            }
            
            function setImagePreviewFromUrl(url) {
                if (url) {
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${url}" alt="Item image">`;
                    document.getElementById('image').value = url;
                    currentImageUrl = url;
                }
            }
            
            // ============================================
            // TOGGLE AVAILABILITY
            // ============================================
            async function toggleAvailability(itemId, currentStatus) {
                const newStatus = !currentStatus;
                const { error } = await supabase
                    .from('menu_items')
                    .update({ is_available: newStatus, updated_at: new Date().toISOString() })
                    .eq('item_id', itemId);
                
                if (error) {
                    showToast('❌ Error updating status', 'error');
                } else {
                    showToast(`✅ Item is now ${newStatus ? 'available' : 'unavailable'}`);
                    await loadAllData();
                }
            }
            
            // ============================================
            // OPEN EDIT MODAL
            // ============================================
            async function openEditModal(itemId) {
                const item = allItems.find(i => i.item_id === itemId);
                if (!item) return;
                
                document.getElementById('itemId').value = item.item_id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('categoryId').value = item.category_id;
                document.getElementById('description').value = item.description || '';
                document.getElementById('type').value = item.type || '';
                document.getElementById('tags').value = item.tags ? item.tags.join(', ') : '';
                document.getElementById('priceDisplay').value = item.price_display || '';
                document.getElementById('icon').value = item.icon || '';
                
                // Set image
                if (item.image) {
                    setImagePreviewFromUrl(item.image);
                } else {
                    document.getElementById('imagePreview').innerHTML = '<span class="placeholder-text">No image selected</span>';
                    document.getElementById('image').value = '';
                }
                document.getElementById('imageFile').value = '';
                document.getElementById('uploadStatus').textContent = '';
                
                const itemVariants = allVariants.filter(v => v.menu_item_id === itemId);
                const container = document.getElementById('variantsContainer');
                container.innerHTML = '';
                itemVariants.forEach(variant => {
                    addVariant(variant.size, variant.price, variant.display);
                });
                
                document.getElementById('modalTitle').textContent = '✏️ Edit Menu Item';
                document.getElementById('itemModal').style.display = 'flex';
            }
            
            // ============================================
            // OPEN ADD MODAL
            // ============================================
            function openAddModal() {
                document.getElementById('itemId').value = '';
                document.getElementById('itemName').value = '';
                document.getElementById('description').value = '';
                document.getElementById('type').value = '';
                document.getElementById('tags').value = '';
                document.getElementById('priceDisplay').value = '';
                document.getElementById('icon').value = '';
                document.getElementById('variantsContainer').innerHTML = '';
                document.getElementById('modalTitle').textContent = '➕ Add New Menu Item';
                document.getElementById('itemModal').style.display = 'flex';
                
                // Clear image
                clearImage();
            }
            
            // ============================================
            // VARIANTS
            // ============================================
            function addVariant(size = '', price = '', display = '') {
                const container = document.getElementById('variantsContainer');
                const variantDiv = document.createElement('div');
                variantDiv.className = 'variant-item';
                variantDiv.innerHTML = `
                    <div class="form-group">
                        <label>Size/Option Name</label>
                        <input type="text" class="variant-size" value="${escapeHtml(size)}" placeholder="e.g., Small Plate">
                    </div>
                    <div class="form-group">
                        <label>Price (₦)</label>
                        <input type="number" class="variant-price" value="${price}" placeholder="e.g., 2800">
                    </div>
                    <div class="form-group">
                        <label>Display Text</label>
                        <input type="text" class="variant-display" value="${escapeHtml(display)}" placeholder="e.g., Small Plate – ₦2,800">
                    </div>
                    <button type="button" onclick="this.parentElement.remove()" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Remove</button>
                `;
                container.appendChild(variantDiv);
            }
            
            // ============================================
            // SAVE MENU ITEM
            // ============================================
            async function saveMenuItem() {
                const itemId = document.getElementById('itemId').value;
                const newItemId = itemId || `item-${Date.now()}`;
                
                // Get image URL (from upload or manual entry)
                const imageUrl = document.getElementById('image').value || currentImageUrl || '';
                
                const itemData = {
                    name: document.getElementById('itemName').value,
                    category_id: document.getElementById('categoryId').value,
                    description: document.getElementById('description').value,
                    type: document.getElementById('type').value,
                    tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t),
                    image: imageUrl,
                    price_display: document.getElementById('priceDisplay').value,
                    icon: document.getElementById('icon').value,
                    updated_at: new Date().toISOString()
                };
                
                if (itemId) {
                    await supabase.from('menu_items').update(itemData).eq('item_id', itemId);
                } else {
                    await supabase.from('menu_items').insert([{ item_id: newItemId, ...itemData }]);
                }
                
                await supabase.from('variants').delete().eq('menu_item_id', newItemId);
                
                const variantDivs = document.querySelectorAll('#variantsContainer .variant-item');
                for (const div of variantDivs) {
                    const size = div.querySelector('.variant-size')?.value;
                    const price = div.querySelector('.variant-price')?.value;
                    const display = div.querySelector('.variant-display')?.value;
                    
                    if (size && price) {
                        await supabase.from('variants').insert([{
                            menu_item_id: newItemId,
                            size: size,
                            price: parseInt(price),
                            display: display || `${size} – ₦${parseInt(price).toLocaleString()}`
                        }]);
                    }
                }
                
                showToast('✅ Menu item saved!');
                closeItemModal();
                await loadAllData();
            }
            
            // ============================================
            // DELETE ITEM
            // ============================================
            async function deleteItem(itemId) {
                if (confirm('Delete this item? This cannot be undone.')) {
                    await supabase.from('variants').delete().eq('menu_item_id', itemId);
                    await supabase.from('menu_items').delete().eq('item_id', itemId);
                    showToast('🗑️ Item deleted');
                    await loadAllData();
                }
            }
            
            // ============================================
            // CATEGORY FUNCTIONS
            // ============================================
            function openCategoryModal() {
                renderCategoriesList();
                document.getElementById('categoryModal').style.display = 'flex';
            }
            
            function renderCategoriesList() {
                const container = document.getElementById('categoriesList');
                container.innerHTML = allCategories.map(cat => `
                    <div style="background: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div>
                            <strong>${escapeHtml(cat.name)}</strong><br>
                            <small style="color: #aaa;">ID: ${cat.category_id} | Order: ${cat.display_order} | ${cat.is_active ? 'Active' : 'Inactive'}</small>
                        </div>
                        <div>
                            <button class="edit-btn" onclick="editCategory('${cat.category_id}')" style="padding: 5px 12px;">Edit</button>
                            <button class="delete-btn" onclick="deleteCategory('${cat.category_id}')" style="padding: 5px 12px;">Delete</button>
                        </div>
                    </div>
                `).join('');
            }
            
            function openAddCategoryForm() {
                document.getElementById('editCategoryId').value = '';
                document.getElementById('categoryIdValue').value = '';
                document.getElementById('categoryName').value = '';
                document.getElementById('categoryDisplayOrder').value = '0';
                document.getElementById('categoryActive').value = 'true';
                document.getElementById('categoryFormTitle').textContent = 'Add Category';
                closeCategoryModal();
                document.getElementById('categoryFormModal').style.display = 'flex';
            }
            
            async function editCategory(categoryId) {
                const cat = allCategories.find(c => c.category_id === categoryId);
                if (cat) {
                    document.getElementById('editCategoryId').value = cat.category_id;
                    document.getElementById('categoryIdValue').value = cat.category_id;
                    document.getElementById('categoryName').value = cat.name;
                    document.getElementById('categoryDisplayOrder').value = cat.display_order || 0;
                    document.getElementById('categoryActive').value = cat.is_active ? 'true' : 'false';
                    document.getElementById('categoryFormTitle').textContent = 'Edit Category';
                    closeCategoryModal();
                    document.getElementById('categoryFormModal').style.display = 'flex';
                }
            }
            
            async function saveCategory() {
                const originalId = document.getElementById('editCategoryId').value;
                const categoryId = document.getElementById('categoryIdValue').value;
                const name = document.getElementById('categoryName').value;
                const displayOrder = parseInt(document.getElementById('categoryDisplayOrder').value) || 0;
                const isActive = document.getElementById('categoryActive').value === 'true';
                
                if (originalId) {
                    await supabase.from('categories').update({
                        category_id: categoryId,
                        name: name,
                        display_order: displayOrder,
                        is_active: isActive
                    }).eq('category_id', originalId);
                    
                    if (originalId !== categoryId) {
                        await supabase.from('menu_items').update({ category_id: categoryId }).eq('category_id', originalId);
                    }
                } else {
                    await supabase.from('categories').insert([{
                        category_id: categoryId,
                        name: name,
                        display_order: displayOrder,
                        is_active: isActive
                    }]);
                }
                
                showToast('✅ Category saved!');
                closeCategoryFormModal();
                await loadAllData();
                openCategoryModal();
            }
            
            async function deleteCategory(categoryId) {
                const itemCount = allItems.filter(i => i.category_id === categoryId).length;
                if (itemCount > 0) {
                    alert(`Cannot delete: ${itemCount} items in this category. Move or delete them first.`);
                    return;
                }
                if (confirm('Delete this category?')) {
                    await supabase.from('categories').delete().eq('category_id', categoryId);
                    showToast('🗑️ Category deleted');
                    await loadAllData();
                    openCategoryModal();
                }
            }
            
            // ============================================
            // MODAL CONTROLS
            // ============================================
            function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }
            function closeCategoryModal() { document.getElementById('categoryModal').style.display = 'none'; }
            function closeCategoryFormModal() { document.getElementById('categoryFormModal').style.display = 'none'; }
            
            // ============================================
            // TOAST
            // ============================================
            function showToast(message) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
            
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            // ============================================
            // THEME
            // ============================================
            function toggleTheme() {
                const root = document.documentElement;
                const themeToggle = document.getElementById('themeToggle');
                const isLightMode = root.classList.contains('light-mode');
                
                if (isLightMode) {
                    root.classList.remove('light-mode');
                    localStorage.setItem('admin_theme', 'dark');
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i><span>Dark Mode</span>';
                } else {
                    root.classList.add('light-mode');
                    localStorage.setItem('admin_theme', 'light');
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i><span>Light Mode</span>';
                }
            }
            
            function loadThemePreference() {
                const savedTheme = localStorage.getItem('admin_theme');
                const themeToggle = document.getElementById('themeToggle');
                
                if (savedTheme === 'light') {
                    document.documentElement.classList.add('light-mode');
                    if (themeToggle) themeToggle.innerHTML = '<i class="fas fa-sun"></i><span>Light Mode</span>';
                } else {
                    document.documentElement.classList.remove('light-mode');
                    if (themeToggle) themeToggle.innerHTML = '<i class="fas fa-moon"></i><span>Dark Mode</span>';
                }
            }
            
            // ============================================
            // GLOBAL EXPOSURE
            // ============================================
            window.toggleAvailability = toggleAvailability;
            window.openEditModal = openEditModal;
            window.openAddModal = openAddModal;
            window.deleteItem = deleteItem;
            window.addVariant = addVariant;
            window.saveMenuItem = saveMenuItem;
            window.closeItemModal = closeItemModal;
            window.filterByStatus = filterByStatus;
            window.openCategoryModal = openCategoryModal;
            window.openAddCategoryForm = openAddCategoryForm;
            window.editCategory = editCategory;
            window.deleteCategory = deleteCategory;
            window.saveCategory = saveCategory;
            window.closeCategoryModal = closeCategoryModal;
            window.closeCategoryFormModal = closeCategoryFormModal;
            window.toggleTheme = toggleTheme;
            window.logout = logout;
            window.handleImageFileSelect = handleImageFileSelect;
            window.uploadImageToSupabase = uploadImageToSupabase;
            window.clearImage = clearImage;
            
            // ============================================
            // EVENT LISTENERS
            // ============================================
            document.getElementById('searchBox')?.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderItems();
            });
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderItems();
                });
            });
            
            // ============================================
            // INITIALIZE
            // ============================================
            checkAuth();
            loadThemePreference();
            loadAllData();
        })();
    </script>
</body>
</html>
